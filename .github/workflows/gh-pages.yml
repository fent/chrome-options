name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Update demo files on gh-pages
        run: |
          mkdir -p gh-pages-branch/node_modules/chrome-options
          rm -rf gh-pages-branch/node_modules/chrome-options/dist
          rm -rf gh-pages-branch/node_modules/chrome-options/sounds
          cp -r dist gh-pages-branch/node_modules/chrome-options/
          cp -r sounds gh-pages-branch/node_modules/chrome-options/
          touch gh-pages-branch/.nojekyll
          cd gh-pages-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add node_modules/chrome-options .nojekyll
          git diff --staged --quiet || git commit -m "chore: update build from master"
          git push
